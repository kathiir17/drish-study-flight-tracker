<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>study flight</title>
<meta name="description" content="a study timer shown as a flight across the globe"/>
<meta name="theme-color" content="#040914"/>
<meta name="color-scheme" content="dark"/>
<!-- home screen / dock app -->
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="study flight"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<canvas id="globe" aria-label="globe: drag to turn, pinch or scroll to zoom, tap a city to choose it"></canvas>

<div id="pill" class="pill" aria-live="polite"></div>


<aside id="panel" class="panel">
  <nav class="tabs" aria-label="sections">
  <button type="button" class="tab" data-view="fly" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15.5v-1.8l-8-5V3.5a1.5 1.5 0 0 0-3 0v5.2l-8 5v1.8l8-2.5v5.4l-2 1.5V21l3.5-1 3.5 1v-1.6l-2-1.5V13z"/></svg>
    <span>fly</span><i class="live-dot" aria-hidden="true"></i>
  </button>
  <button type="button" class="tab" data-view="passes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5zM15 5v14" class="stroke"/></svg>
    <span>passes</span>
  </button>
  <button type="button" class="tab" data-view="map">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5zM9 4v13.5M15 6.5V20" class="stroke"/></svg>
    <span>map</span>
  </button>
  <button type="button" class="tab" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9" class="stroke thick"/></svg>
    <span>stats</span>
  </button>
  </nav>

  <div class="panel-body">
  <!-- ── fly ─────────────────────────────────────────── -->
  <section id="view-fly" class="view" aria-label="fly">

    <form id="card-plan" class="block" autocomplete="off" novalidate>
      <div class="route-fields">
        <div class="field">
          <span class="marker from" aria-hidden="true"></span>
          <input id="inp-from" placeholder="from" aria-label="departure city" spellcheck="false" autocapitalize="off" autocorrect="off"
                 role="combobox" aria-autocomplete="list" aria-controls="ac" aria-expanded="false"/>
        </div>
        <div class="field">
          <span class="marker to" aria-hidden="true"></span>
          <input id="inp-to" placeholder="to" aria-label="destination city" spellcheck="false" autocapitalize="off" autocorrect="off"
                 role="combobox" aria-autocomplete="list" aria-controls="ac" aria-expanded="false"/>
        </div>
        <button type="button" id="btn-swap" class="icon-btn swap" aria-label="swap cities">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v15M8 4 4.5 7.5M8 4l3.5 3.5M16 20V5m0 15-3.5-3.5M16 20l3.5-3.5"/></svg>
        </button>
      </div>

      <p id="route-preview" class="preview"></p>

      <div class="pomo-row">
        <label class="toggle">
          <input type="checkbox" id="chk-pomo" role="switch"/>
          <span class="toggle-track" aria-hidden="true"></span>
          <span>pomodoro</span>
        </label>
        <div id="pomo-lengths" class="pomo-lengths" hidden>
          <label><input type="number" id="pomo-focus" inputmode="numeric" min="1" max="180" step="1" aria-label="focus minutes"/> min focus</label>
          <label><input type="number" id="pomo-break" inputmode="numeric" min="1" max="60" step="1" aria-label="break minutes"/> min break</label>
        </div>
      </div>

      <p id="plan-msg" class="msg" role="alert"></p>
    </form>

    <div id="card-flight" class="block" hidden>
      <div class="flight-head">
        <h2 id="fl-route" class="route-title"></h2>
        <button type="button" id="btn-stop" class="quiet small">stop</button>
      </div>
      <div class="flight-body">
        <div class="time-left">
          <div id="fl-left" class="big-num"></div>
          <div class="sub">left in the air</div>
          <div id="fl-real" class="sub" hidden></div>
        </div>
        <div id="pomo-ring" class="ring" hidden>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="ring-track" cx="32" cy="32" r="27"/>
            <circle id="pomo-arc" class="ring-arc" cx="32" cy="32" r="27"/>
          </svg>
          <div class="ring-text"><b id="pomo-time"></b><span id="pomo-phase"></span></div>
        </div>
      </div>
      <div class="progress">
        <div class="track"><div id="fl-bar" class="fill"></div></div>
        <div class="progress-meta"><span id="fl-flown"></span><span id="fl-togo"></span></div>
      </div>
    </div>

    <div id="speed-row" class="speed-row">
      <span class="speed-label">speed</span>
      <div class="segmented" role="group" aria-label="flight speed">
        <button type="button" data-speed="1" aria-pressed="true">1x</button>
        <button type="button" data-speed="2" aria-pressed="false">2x</button>
        <button type="button" data-speed="5" aria-pressed="false">5x</button>
        <button type="button" data-speed="10" aria-pressed="false">10x</button>
        <button type="button" data-speed="100" aria-pressed="false">100x</button>
        <button type="button" data-speed="10000" aria-pressed="false">10000x</button>
      </div>
    </div>
    <!-- outside the form so it can sit under the speed control; form= still submits it -->
    <button type="submit" form="card-plan" id="btn-fly" class="primary">fly</button>

    <div id="card-landed" class="block" hidden>
      <h2 id="ld-title" class="landed-title"></h2>
      <p id="ld-sub" class="landed-sub"></p>
      <div class="actions">
        <button type="button" id="btn-onward" class="primary"></button>
        <button type="button" id="btn-new" class="quiet">new route</button>
      </div>
    </div>
  </section>

  <!-- ── passes ──────────────────────────────────────── -->
  <section id="view-passes" class="view" aria-label="passes" hidden>
    <header class="sheet-head">
      <h2>your flights</h2>
      <span id="hist-count" class="sheet-count"></span>
    </header>
    <div id="hist-list" class="hist-list"></div>
  </section>

  <!-- ── map ─────────────────────────────────────────── -->
  <section id="view-map" class="view" aria-label="map" hidden>
    <div class="soon">
      <h2>your flight map</h2>
      <p>every route you've flown, drawn across the globe. it's being built now, and your finished flights will all be on it.</p>
    </div>
  </section>

  <!-- ── stats ───────────────────────────────────────── -->
  <section id="view-stats" class="view" aria-label="stats" hidden>
    <div class="soon">
      <h2>your stats</h2>
      <p>hours per module, longest flights, streaks and the places you've been. coming soon, counting every flight you land.</p>
    </div>
  </section>
  </div>
</aside>


<!-- city suggestions: at page level so the panel's scrolling can't clip it; app.js positions it -->
<ul id="ac" class="ac" role="listbox" hidden></ul>

<script src="app.js" defer></script>
<script type="module" src="db.js"></script>
</body>
</html>
